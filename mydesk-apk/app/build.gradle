plugins {
    id 'com.android.application'
}

android {
    namespace 'com.mydesk.ai'
    compileSdk 35

    defaultConfig {
        applicationId 'com.mydesk.ai'
        minSdk 26
        targetSdk 35
        versionCode 20100
        versionName '0.2.1'
    }

    buildTypes {
        debug {
            debuggable false
        }
        release {
            minifyEnabled false
        }
    }
}
