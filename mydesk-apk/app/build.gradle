plugins {
    id 'com.android.application'
}

android {
    namespace 'com.mydesk.ai'
    compileSdk 35

    defaultConfig {
        applicationId 'com.mydesk.ai'
        minSdk 26
        targetSdk 34
        versionCode 40200
        versionName '0.4.2'
    }

    buildTypes {
        debug {
            debuggable false
        }
        release {
            minifyEnabled false
        }
    }

    testOptions {
        unitTests.returnDefaultValues = true
    }
}

dependencies {
    testImplementation 'junit:junit:4.13.2'
}
