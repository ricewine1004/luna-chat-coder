name: Build Black Stigma Item AI v10

on:
  push:
    branches:
      - delivery-item-ai-v4
    paths:
      - 'delivery/item-ai-v3/apply_v10_patch.py'
      - '.github/workflows/build-item-ai-v10.yml'
  workflow_dispatch:

jobs:
  build-windows:
    runs-on: windows-latest
    permissions:
      contents: write
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup build Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install build dependencies
        shell: pwsh
        run: |
          python -m pip install --upgrade pip
          python -m pip install pyinstaller pillow huggingface_hub

      - name: Apply v10 patch
        shell: pwsh
        run: |
          python delivery/item-ai-v3/apply_v10_patch.py

      - name: Compile GUI source
        shell: pwsh
        run: |
          python -m py_compile delivery/item-ai-v3/item_ai_app.py

      - name: Verify v10 potion rules and completion logs
        shell: pwsh
        run: |
          $src = Get-Content 'delivery/item-ai-v3/item_ai_app.py' -Raw
          if ($src -notmatch "APP='검은 성흔 Item AI v10'") { throw 'v10 title missing' }
          if ($src -notmatch 'vivid ruby red to crimson healing liquid') { throw 'health potion red rule missing' }
          if ($src -notmatch 'luminous sapphire blue to cyan magical liquid') { throw 'mana potion blue rule missing' }
          if ($src -notmatch 'vivid emerald green herbal antidote liquid') { throw 'antidote green rule missing' }
          if ($src -notmatch 'radiant amber orange and golden enhancement elixir') { throw 'enhancement gold rule missing' }
          if ($src -notmatch 'luminous violet liquid with silver-blue protective highlights') { throw 'resistance violet rule missing' }
          if ($src -notmatch 'do not darken or obscure the liquid color') { throw 'potion visibility rule missing' }
          if ($src -notmatch '✅ 이미지 4장 생성 완료') { throw 'image completion log missing' }
          if ($src -notmatch '✅ 모델 다운로드 / 확인 완료') { throw 'model completion log missing' }
          if ($src -notmatch 'segmind/SSD-1B') { throw 'fast model missing' }
          if ($src -notmatch 'local_dir=str\(root\)') { throw 'symlink-free local_dir missing' }
          if ($src -notmatch 'left_scroll=ttk.Scrollbar') { throw 'left scroll missing' }
          if ($src -notmatch 'WM_DELETE_WINDOW') { throw 'clean shutdown missing' }

      - name: Build EXE
        shell: pwsh
        run: |
          pyinstaller --noconfirm --clean --onefile --windowed `
            --name BlackStigmaItemAI `
            --hidden-import PIL._tkinter_finder `
            delivery/item-ai-v3/item_ai_app.py

      - name: Verify executable
        shell: pwsh
        run: |
          if (-not (Test-Path 'dist/BlackStigmaItemAI.exe')) { throw 'BlackStigmaItemAI.exe not found' }
          Get-Item 'dist/BlackStigmaItemAI.exe' | Format-List Name,Length,LastWriteTime
          Get-FileHash 'dist/BlackStigmaItemAI.exe' -Algorithm SHA256 | Format-List

      - name: Package
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force -Path package | Out-Null
          Copy-Item 'dist/BlackStigmaItemAI.exe' 'package/BlackStigmaItemAI.exe'
          @'
          검은 성흔 Item AI v10

          추가 사항
          - 생명력 물약: 선명한 붉은/크림슨 액체
          - 마나 물약: 푸른/청록 마력 액체
          - 해독 물약: 에메랄드 녹색 액체
          - 강화 물약: 금빛/주황 강화 액체
          - 저항 물약: 보라 + 은빛 보호 액체
          - 병 외형은 검은 성흔의 어두운 고딕 분위기를 유지하되 액체 색은 명확하게 보이도록 강화
          - 작업 성공 시 화면 로그창에 ✅ 완료 표시

          기존 유지 기능
          - 빠른 SSD-1B / 고품질 SDXL 모델 선택
          - symlink 없는 local_dir 모델 저장
          - 외부 전용 Python worker
          - 좌측 스크롤
          - 종료 시 AI/GPU 프로세스 정리
          '@ | Set-Content -Encoding UTF8 package/사용방법.txt
          Compress-Archive -Path package/* -DestinationPath BlackStigmaItemAI_Windows_v10.zip -Force

      - name: Upload direct-download artifact
        uses: actions/upload-artifact@v4
        with:
          name: BlackStigmaItemAI-Windows-v10
          path: BlackStigmaItemAI_Windows_v10.zip
          retention-days: 1

      - name: Publish public delivery release
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $tag='black-stigma-item-ai-v10-delivery'
          gh release view $tag 2>$null
          if ($LASTEXITCODE -eq 0) { gh release delete $tag --yes --cleanup-tag }
          gh release create $tag 'BlackStigmaItemAI_Windows_v10.zip' `
            --target '${{ github.sha }}' `
            --title 'Black Stigma Item AI Windows v10' `
            --notes 'Potion semantic color rules and visible completion log markers.'
