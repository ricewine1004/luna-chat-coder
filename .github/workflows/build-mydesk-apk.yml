name: Build MyDesk AI APK
on:
  push:
    branches: [ "mydesk-ai-apk-build" ]
    paths:
      - 'mydesk-apk/**'
      - '.github/workflows/build-mydesk-apk.yml'
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: mydesk-apk
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.10.2'
      - name: Build APK
        run: gradle :app:assembleDebug --no-daemon
      - name: Rename APK
        run: cp app/build/outputs/apk/debug/app-debug.apk MyDesk_AI_0.1.0.apk
      - uses: actions/upload-artifact@v4
        with:
          name: MyDesk_AI_0.1.0_APK
          path: mydesk-apk/MyDesk_AI_0.1.0.apk
          if-no-files-found: error
