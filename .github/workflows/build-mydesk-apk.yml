name: Build MyDesk AI APK
on:
  push:
    branches: [ "mydesk-ai-apk-build" ]
    paths:
      - 'mydesk-apk/**'
      - '.github/workflows/build-mydesk-apk.yml'
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: mydesk-apk
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.10.2'
      - name: Build unsigned release APK
        run: gradle :app:assembleRelease --no-daemon
      - name: Collect signing tool
        shell: bash
        run: |
          set -euo pipefail
          cp app/build/outputs/apk/release/app-release-unsigned.apk MyDesk_AI_0.2.0_unsigned.apk
          APKSIGNER_JAR=$(find "$ANDROID_HOME/build-tools" -type f -path '*/lib/apksigner.jar' | sort -V | tail -n 1)
          test -n "$APKSIGNER_JAR"
          cp "$APKSIGNER_JAR" apksigner.jar
      - uses: actions/upload-artifact@v4
        with:
          name: MyDesk_AI_0.2.0_UNSIGNED_AND_SIGNER
          path: |
            mydesk-apk/MyDesk_AI_0.2.0_unsigned.apk
            mydesk-apk/apksigner.jar
          if-no-files-found: error
