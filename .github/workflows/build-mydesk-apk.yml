name: Build MyDesk AI APK
on:
  push:
    branches: [ "mydesk-ai-apk-build" ]
    paths:
      - 'mydesk-apk/**'
      - '.github/workflows/build-mydesk-apk.yml'
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: mydesk-apk
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.10.2'
      - name: Stamp Android shell version
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p = Path('app/src/main/java/com/mydesk/ai/MainActivity.java')
          s = p.read_text(encoding='utf-8')
          for old in ['0.3.8','0.4.1','0.4.2']:
              s = s.replace(f'private static final String WEB_SHELL_VERSION = "{old}";', 'private static final String WEB_SHELL_VERSION = "0.4.2-r3";')
          for old in ['0.3.8','0.4.1']:
              s = s.replace(f'MyDeskAI-Android/{old}', 'MyDeskAI-Android/0.4.2')
          p.write_text(s, encoding='utf-8')
          PY
      - name: Verify Android reminder contracts
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path
          base = Path('app/src/main/java/com/mydesk/ai')
          files = {p.name: p.read_text(encoding='utf-8') for p in base.glob('*.java')}
          checks = {
              'shell 0.4.2-r3': '0.4.2-r3' in files['MainActivity.java'],
              'voice limited daily parser': 'DAILY_LIMITED' in files['MainActivity.java'] and 'repeatDays' in files['MainActivity.java'],
              'limited repeat scheduler': 'DAILY_LIMITED' in files['ReminderScheduler.java'] and 'clampRepeatDays' in files['ReminderScheduler.java'],
              'completion cancels all': 'cancelAll(context, id)' in files['ReminderActionReceiver.java'],
              'receiver schedules next': 'scheduleRecurringNext' in files['ReminderReceiver.java'],
              '5 minute fast sync': 'FAST_SYNC_INTERVAL_MS = 5 * 60 * 1000L' in files['ReminderSyncJobService.java'],
              'sync overlap': 'SYNC_OVERLAP_MS' in files['ReminderSyncJobService.java'] and 'overlapSince' in files['ReminderSyncJobService.java'],
              'full recovery sync': 'FULL_SYNC_INTERVAL_MS' in files['ReminderSyncJobService.java'],
              'task-only sync': '&kinds=task' in files['ReminderSyncJobService.java'],
              'boot immediate sync': 'ReminderSyncJobService.syncNow(context)' in files['BootReceiver.java'],
          }
          failed = [name for name, ok in checks.items() if not ok]
          if failed:
              raise SystemExit('Android feature contract failed: ' + ', '.join(failed))
          print('Android reminder/sync contracts: PASS')
          PY
      - name: Generate MyDesk signature sound resource
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p app/src/main/res/raw
          python3 - <<'PY'
          import math, wave, struct
          from pathlib import Path
          sr = 44100
          dur = 1.0
          n = int(sr * dur)
          buf = [0.0] * n
          def add_tone(freq, start, length, amp=0.2, decay=6.4, harmonic=0.16):
              i0 = int(start * sr)
              i1 = min(n, int((start + length) * sr))
              for i in range(i0, i1):
                  t = (i - i0) / sr
                  attack = min(1.0, t / 0.006) if t < 0.006 else 1.0
                  env = math.exp(-decay * t) * attack
                  sig = math.sin(2 * math.pi * freq * t)
                  sig += harmonic * math.sin(2 * math.pi * freq * 2.01 * t)
                  buf[i] += amp * env * sig
          add_tone(587.33, 0.00, 0.32, 0.18)
          add_tone(739.99, 0.20, 0.34, 0.20)
          add_tone(987.77, 0.43, 0.40, 0.24)
          add_tone(1975.53, 0.62, 0.20, 0.05, 10.5, 0.0)
          peak = max(abs(x) for x in buf) or 1.0
          scale = 0.84 / peak
          out = Path('app/src/main/res/raw/mydesk_signature_b.wav')
          with wave.open(str(out), 'wb') as wf:
              wf.setnchannels(1)
              wf.setsampwidth(2)
              wf.setframerate(sr)
              frames = b''.join(struct.pack('<h', max(-32767, min(32767, int(x * scale * 32767)))) for x in buf)
              wf.writeframes(frames)
          PY
      - name: Run reminder unit tests
        run: gradle :app:testReleaseUnitTest --no-daemon
      - name: Build unsigned release APK
        run: gradle :app:assembleRelease --no-daemon
      - name: Collect signing tool
        shell: bash
        run: |
          set -euo pipefail
          cp app/build/outputs/apk/release/app-release-unsigned.apk MyDesk_AI_0.4.2_unsigned.apk
          APKSIGNER_JAR=$(find "$ANDROID_HOME/build-tools" -type f -path '*/lib/apksigner.jar' | sort -V | tail -n 1)
          test -n "$APKSIGNER_JAR"
          cp "$APKSIGNER_JAR" apksigner.jar
      - uses: actions/upload-artifact@v4
        with:
          name: MyDesk_AI_0.4.2_UNSIGNED_AND_SIGNER
          path: |
            mydesk-apk/MyDesk_AI_0.4.2_unsigned.apk
            mydesk-apk/apksigner.jar
          if-no-files-found: error
