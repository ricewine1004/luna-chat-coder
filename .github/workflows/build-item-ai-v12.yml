name: Build Black Stigma Item AI v12

on:
  push:
    branches:
      - delivery-item-ai-v4
    paths:
      - 'delivery/item-ai-v3/apply_v12_patch.py'
      - '.github/workflows/build-item-ai-v12.yml'
  workflow_dispatch:

jobs:
  build-windows:
    runs-on: windows-latest
    permissions:
      contents: write
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup build Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install build dependencies
        shell: pwsh
        run: |
          python -m pip install --upgrade pip
          python -m pip install pyinstaller pillow huggingface_hub

      - name: Apply v12 patch
        shell: pwsh
        run: |
          python delivery/item-ai-v3/apply_v12_patch.py

      - name: Compile GUI source
        shell: pwsh
        run: |
          python -m py_compile delivery/item-ai-v3/item_ai_app.py

      - name: Verify v12 shared model architecture
        shell: pwsh
        run: |
          $src = Get-Content 'delivery/item-ai-v3/item_ai_app.py' -Raw
          if ($src -notmatch "APP='검은 성흔 Item AI v12'") { throw 'v12 title missing' }
          if ($src -notmatch 'BlackStigmaItemAI_Models') { throw 'shared model root missing' }
          if ($src -notmatch 'SHARED_MODEL_ROOT') { throw 'shared model variable missing' }
          if ($src -notmatch 'migrate_legacy_models') { throw 'legacy model migration missing' }
          if ($src -notmatch '기존 모델 공용 폴더 자동 이관 완료') { throw 'migration completion log missing' }
          if ($src -notmatch "self.cfg\['model_dir'\]=str\(SHARED_MODEL_ROOT\)") { throw 'config model path lock missing' }
          if ($src -notmatch 'BlackStigmaItemAI_Engine') { throw 'shared engine path missing' }
          if ($src -notmatch 'segmind/SSD-1B') { throw 'fast model missing' }
          if ($src -notmatch 'stabilityai/stable-diffusion-xl-base-1.0') { throw 'quality model missing' }
          if ($src -notmatch 'local_dir=str\(root\)') { throw 'local_dir model download missing' }
          if ($src -notmatch 'local_files_only=True') { throw 'offline local model load missing' }
          if ($src -notmatch 'official Black Stigma dark fantasy ARPG item art direction') { throw 'v11 style lock missing' }
          if ($src -notmatch 'vivid ruby red to crimson healing liquid') { throw 'v10 potion rule missing' }
          if ($src -notmatch '✅ 이미지 4장 생성 완료') { throw 'completion log missing' }
          if ($src -notmatch 'WM_DELETE_WINDOW') { throw 'clean shutdown missing' }

      - name: Smoke test migration logic
        shell: pwsh
        run: |
          $src = Get-Content 'delivery/item-ai-v3/item_ai_app.py' -Raw
          if ($src -notmatch "src\.rename\(dst\)") { throw 'same-drive fast move migration missing' }
          if ($src -notmatch "shutil\.copytree\(src,dst,dirs_exist_ok=True\)") { throw 'cross-drive migration fallback missing' }
          if ($src -notmatch "BASE\.parent") { throw 'previous-version sibling scan missing' }

      - name: Build EXE
        shell: pwsh
        run: |
          pyinstaller --noconfirm --clean --onefile --windowed `
            --name BlackStigmaItemAI `
            --hidden-import PIL._tkinter_finder `
            delivery/item-ai-v3/item_ai_app.py

      - name: Verify executable
        shell: pwsh
        run: |
          if (-not (Test-Path 'dist/BlackStigmaItemAI.exe')) { throw 'BlackStigmaItemAI.exe not found' }
          Get-Item 'dist/BlackStigmaItemAI.exe' | Format-List Name,Length,LastWriteTime
          Get-FileHash 'dist/BlackStigmaItemAI.exe' -Algorithm SHA256 | Format-List

      - name: Package
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force -Path package | Out-Null
          Copy-Item 'dist/BlackStigmaItemAI.exe' 'package/BlackStigmaItemAI.exe'
          @'
          검은 성흔 Item AI v12

          핵심 변경
          - AI 엔진: 드라이브 루트의 BlackStigmaItemAI_Engine 공용 폴더 사용
          - AI 모델: 드라이브 루트의 BlackStigmaItemAI_Models 공용 폴더 사용
          - 프로그램 버전 폴더를 바꿔도 이미 받은 모델을 재사용
          - 같은 상위 폴더의 이전 v9/v10/v11 모델을 찾아 공용 폴더로 자동 이관
          - 같은 드라이브에서는 폴더 이동 방식으로 빠르게 이관하여 재다운로드 방지
          - 공용 폴더에 모델이 있으면 다운로드 없이 바로 준비됨으로 인식

          기존 유지
          - 빠른 SSD-1B / 고품질 SDXL 선택
          - 검은 성흔 전용 스타일 고정
          - 물약 기능별 색상 규칙
          - 작업 완료 ✅ 로그
          - 외부 AI worker
          - 좌측 스크롤
          - 종료 시 AI/GPU 프로세스 정리
          '@ | Set-Content -Encoding UTF8 package/사용방법.txt
          Compress-Archive -Path package/* -DestinationPath BlackStigmaItemAI_Windows_v12.zip -Force

      - name: Upload direct-download artifact
        uses: actions/upload-artifact@v4
        with:
          name: BlackStigmaItemAI-Windows-v12
          path: BlackStigmaItemAI_Windows_v12.zip
          retention-days: 1

      - name: Publish public delivery release
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $tag='black-stigma-item-ai-v12-delivery'
          gh release view $tag 2>$null
          if ($LASTEXITCODE -eq 0) { gh release delete $tag --yes --cleanup-tag }
          gh release create $tag 'BlackStigmaItemAI_Windows_v12.zip' `
            --target '${{ github.sha }}' `
            --title 'Black Stigma Item AI Windows v12' `
            --notes 'Uses shared persistent engine/model folders and migrates previous local models to avoid repeated downloads.'
