name: Build MyDesk AI Windows Installer

on:
  push:
    branches: [ "mydesk-ai-apk-build" ]
    paths:
      - 'mydesk-windows/**'
      - '.github/workflows/build-mydesk-windows.yml'
  workflow_dispatch:

jobs:
  build-windows:
    runs-on: windows-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'

      - name: Verify common payload integrity and safety
        shell: pwsh
        run: |
          @'
          import base64, hashlib, io, re, zipfile
          from pathlib import Path

          root = Path('mydesk-windows')
          sequence = ['01','02','03A','03B','03C','04','05']
          values = []
          for suffix in sequence:
              text = (root / f'CommonPatch042Part{suffix}.cs').read_text(encoding='utf-8')
              m = re.search(r'"([A-Za-z0-9+/=]+)"', text)
              if not m:
                  raise SystemExit(f'payload part {suffix} string missing')
              values.append(m.group(1))
          raw = base64.b64decode(''.join(values), validate=True)
          sha = hashlib.sha256(raw).hexdigest()
          manifest = (root / 'CommonUpdatePayload.cs').read_text(encoding='utf-8')
          expected = re.search(r'Sha256 = "([0-9a-f]{64})"', manifest).group(1)
          if sha != expected:
              raise SystemExit(f'payload SHA mismatch: {sha} != {expected}')
          with zipfile.ZipFile(io.BytesIO(raw)) as z:
              names = sorted(n for n in z.namelist() if not n.endswith('/'))
              required = sorted(['public/app.js','public/index.html','public/styles.css','public/sw.js','src/index.js'])
              if names != required:
                  raise SystemExit(f'unexpected payload files: {names}')
              forbidden = {'wrangler.jsonc','PRIVATE_OWNER_CODE.txt','OWNER_KEY_HASH.txt'}
              if forbidden.intersection(names):
                  raise SystemExit('auth/config file leaked into payload')
              app = z.read('public/app.js').decode('utf-8')
              html = z.read('public/index.html').decode('utf-8')
              css = z.read('public/styles.css').decode('utf-8')
              server = z.read('src/index.js').decode('utf-8')
              checks = [
                  ('task repeat', 'id="taskRepeat"' in html),
                  ('schedule repeat', 'id="scheduleRepeat"' in html),
                  ('meeting repeat', 'id="meetingRepeat"' in html),
                  ('calendar picker', 'openNativePicker' in app),
                  ('limited repeat', 'DAILY_LIMITED' in app and 'DAILY_LIMITED' in server),
                  ('repeat days', 'repeatDays' in app and 'repeatDays' in server),
                  ('mobile schedule nav', 'data-page="schedule"' in html and '일정·미팅' in html),
                  ('mobile layout', '.mobile-nav' in css and 'repeat(6' in css),
                  ('meeting records', 'meeting' in app and 'meeting' in server),
              ]
              failed = [name for name, ok in checks if not ok]
              if failed:
                  raise SystemExit('feature contract failed: ' + ', '.join(failed))
          print('Common payload integrity/safety/features: PASS', sha)
          '@ | python -

      - name: Generate MyDesk AI Windows icon
        shell: pwsh
        run: |
          Add-Type -AssemblyName System.Drawing
          Add-Type @"
          using System;
          using System.Runtime.InteropServices;
          public static class NativeIcon {
              [DllImport("user32.dll", CharSet = CharSet.Auto)]
              public static extern bool DestroyIcon(IntPtr handle);
          }
          "@

          $assetDir = Join-Path $PWD 'mydesk-windows\Assets'
          New-Item -ItemType Directory -Force -Path $assetDir | Out-Null
          $bmp = New-Object System.Drawing.Bitmap 256,256
          $g = [System.Drawing.Graphics]::FromImage($bmp)
          $g.SmoothingMode = [System.Drawing.Drawing2D.SmoothingMode]::AntiAlias
          $g.Clear([System.Drawing.Color]::FromArgb(243,240,255))

          $teal = New-Object System.Drawing.SolidBrush ([System.Drawing.Color]::FromArgb(143,230,222))
          $dark = New-Object System.Drawing.SolidBrush ([System.Drawing.Color]::FromArgb(90,97,112))
          $ink = New-Object System.Drawing.SolidBrush ([System.Drawing.Color]::FromArgb(60,63,73))
          $pink = New-Object System.Drawing.SolidBrush ([System.Drawing.Color]::FromArgb(255,139,156))
          $darkPen = New-Object System.Drawing.Pen ([System.Drawing.Color]::FromArgb(90,97,112)), 16
          $darkPen.StartCap = [System.Drawing.Drawing2D.LineCap]::Round
          $darkPen.EndCap = [System.Drawing.Drawing2D.LineCap]::Round
          $smilePen = New-Object System.Drawing.Pen ([System.Drawing.Color]::White), 8

          $g.FillEllipse($teal, 50, 50, 156, 168)
          $g.DrawArc($darkPen, 47, 30, 162, 135, 195, 150)
          $g.FillEllipse($dark, 29, 101, 40, 70)
          $g.FillEllipse($dark, 187, 101, 40, 70)
          $g.FillEllipse($ink, 91, 119, 15, 18)
          $g.FillEllipse($ink, 150, 119, 15, 18)
          $g.FillEllipse($pink, 72, 148, 30, 16)
          $g.FillEllipse($pink, 154, 148, 30, 16)
          $g.DrawArc($smilePen, 106, 137, 45, 40, 20, 140)
          $g.DrawLine($darkPen, 195, 161, 232, 170)
          $g.FillEllipse($dark, 226, 164, 15, 15)

          $pngPath = Join-Path $assetDir 'mydesk.png'
          $icoPath = Join-Path $assetDir 'mydesk.ico'
          $bmp.Save($pngPath, [System.Drawing.Imaging.ImageFormat]::Png)
          $hIcon = $bmp.GetHicon()
          $icon = [System.Drawing.Icon]::FromHandle($hIcon)
          $stream = [System.IO.File]::Create($icoPath)
          $icon.Save($stream)
          $stream.Dispose()
          $icon.Dispose()
          [NativeIcon]::DestroyIcon($hIcon) | Out-Null
          $g.Dispose(); $bmp.Dispose(); $teal.Dispose(); $dark.Dispose(); $ink.Dispose(); $pink.Dispose(); $darkPen.Dispose(); $smilePen.Dispose()

      - name: Restore Windows client
        run: dotnet restore mydesk-windows/MyDeskAI.Windows.csproj

      - name: Build Windows client
        run: dotnet build mydesk-windows/MyDeskAI.Windows.csproj -c Release --no-restore

      - name: Publish Windows client
        run: dotnet publish mydesk-windows/MyDeskAI.Windows.csproj -c Release -r win-x64 --self-contained true -o mydesk-windows/publish --no-restore

      - name: Install Inno Setup if needed
        shell: pwsh
        run: |
          $paths = @(
            'C:\Program Files (x86)\Inno Setup 6\ISCC.exe',
            'C:\Program Files\Inno Setup 6\ISCC.exe'
          )
          $found = $paths | Where-Object { Test-Path $_ } | Select-Object -First 1
          if (-not $found) {
            choco install innosetup --no-progress -y
          }

      - name: Build installer EXE
        shell: pwsh
        run: |
          $paths = @(
            'C:\Program Files (x86)\Inno Setup 6\ISCC.exe',
            'C:\Program Files\Inno Setup 6\ISCC.exe'
          )
          $iscc = $paths | Where-Object { Test-Path $_ } | Select-Object -First 1
          if (-not $iscc) { throw 'Inno Setup ISCC.exe not found' }
          & $iscc 'mydesk-windows\installer\MyDeskAI.iss'
          if ($LASTEXITCODE -ne 0) { throw "Inno Setup failed with exit code $LASTEXITCODE" }

      - name: Verify installer output
        shell: pwsh
        run: |
          $installer = 'mydesk-windows\dist\MyDesk_AI_PC_AutoUpdate_0.4.2.exe'
          if (-not (Test-Path $installer)) { throw 'Installer was not created' }
          Get-FileHash $installer -Algorithm SHA256 | Format-List
          Get-Item $installer | Format-List Name,Length,LastWriteTime

      - uses: actions/upload-artifact@v4
        with:
          name: MyDesk_AI_PC_AutoUpdate_0.4.2
          path: mydesk-windows/dist/MyDesk_AI_PC_AutoUpdate_0.4.2.exe
          if-no-files-found: error
