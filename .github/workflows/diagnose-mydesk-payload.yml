name: Diagnose MyDesk Payload
on:
  push:
    branches: [ "mydesk-ai-apk-build" ]
    paths:
      - 'mydesk-windows/CommonPatch042Part*.cs'
      - '.github/workflows/diagnose-mydesk-payload.yml'
  workflow_dispatch:

jobs:
  diagnose:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Check chunks
        shell: bash
        run: |
          python3 - <<'PY'
          import base64, hashlib, io, re, zipfile
          from pathlib import Path
          root=Path('mydesk-windows')
          vals=[]
          for i in range(1,6):
              s=(root/f'CommonPatch042Part{i:02d}.cs').read_text()
              v=re.search(r'"([A-Za-z0-9+/=]+)"',s).group(1)
              vals.append(v)
              print(i, len(v), hashlib.sha256(v.encode()).hexdigest())
          b=''.join(vals)
          print('b64len',len(b))
          raw=base64.b64decode(b,validate=True)
          print('rawlen',len(raw),'sha',hashlib.sha256(raw).hexdigest())
          try:
              with zipfile.ZipFile(io.BytesIO(raw)) as z:
                  print('names',z.namelist())
                  for n in z.namelist():
                      if not n.endswith('/'):
                          d=z.read(n)
                          print('file',n,len(d),hashlib.sha256(d).hexdigest())
          except Exception as e:
              print('zip_error',repr(e))
              raise
          PY
