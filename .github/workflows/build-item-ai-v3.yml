name: Build Black Stigma Item AI v3

on:
  push:
    branches:
      - delivery-item-ai-v3
    paths:
      - 'delivery/item-ai-v3/**'
      - '.github/workflows/build-item-ai-v3.yml'
  workflow_dispatch:

jobs:
  build-windows:
    runs-on: windows-latest
    permissions:
      contents: write
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install build dependencies
        shell: pwsh
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r delivery/item-ai-v3/requirements-build.txt

      - name: Compile source check
        shell: pwsh
        run: python -m py_compile delivery/item-ai-v3/item_ai_app.py

      - name: Verify required UI strings
        shell: pwsh
        run: |
          $src = Get-Content delivery/item-ai-v3/item_ai_app.py -Raw
          if ($src -notmatch 'AI 엔진 설치 / 복구') { throw 'Engine install button missing' }
          if ($src -notmatch '모델 다운로드 / 확인') { throw 'Model download button missing' }
          if ($src -notmatch 'WM_DELETE_WINDOW') { throw 'Clean shutdown handler missing' }

      - name: Build EXE
        shell: pwsh
        run: |
          pyinstaller --noconfirm --clean --onefile --windowed `
            --name BlackStigmaItemAI `
            --collect-all pip `
            --hidden-import PIL._tkinter_finder `
            delivery/item-ai-v3/item_ai_app.py

      - name: Verify executable
        shell: pwsh
        run: |
          if (-not (Test-Path 'dist/BlackStigmaItemAI.exe')) { throw 'EXE missing' }
          Get-Item dist/BlackStigmaItemAI.exe | Format-List Name,Length,LastWriteTime
          Get-FileHash dist/BlackStigmaItemAI.exe -Algorithm SHA256 | Format-List

      - name: Package
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force -Path package | Out-Null
          Copy-Item dist/BlackStigmaItemAI.exe package/BlackStigmaItemAI.exe
          @'
          검은 성흔 Item AI v3

          1. BlackStigmaItemAI.exe 실행
          2. 상단 AI 준비 영역의 'AI 엔진 설치 / 복구' 실행
          3. 완료 후 '모델 다운로드 / 확인' 실행
          4. 아이템 옵션 선택 후 생성

          종료 시 AI 모델/GPU 캐시/이미지 참조를 정리한 뒤 프로그램이 종료됩니다.
          데이터/로그는 실행파일 옆 BlackStigmaItemAI_Data 폴더에 저장됩니다.
          '@ | Set-Content -Encoding UTF8 package/사용방법.txt
          Compress-Archive -Path package/* -DestinationPath BlackStigmaItemAI_Windows_v3.zip -Force

      - name: Publish public delivery release
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $tag = 'black-stigma-item-ai-v3-delivery'
          gh release view $tag 2>$null
          if ($LASTEXITCODE -eq 0) { gh release delete $tag --yes --cleanup-tag }
          gh release create $tag BlackStigmaItemAI_Windows_v3.zip `
            --target '${{ github.sha }}' `
            --title 'Black Stigma Item AI Windows v3' `
            --notes 'Engine/model buttons restored and clean shutdown enabled.'
